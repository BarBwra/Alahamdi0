modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Soft dependencies for the warehouse subsystem. Every foreign item is resolved by
# ResourceLocation at runtime, so the mod loads and runs with none of these present - a recipe
# naming a missing item is reported as unavailable in the terminal instead of crashing the pack.
[[dependencies.${mod_id}]]
    modId="nukacraft"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="survivorsarsenal"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="survival_instinct"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
