org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.10
# The Forge version range can use any version of Forge as bounds
forge_version_range=[47,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[47,)
# The mapping channel to use for mappings.
mapping_channel=official
# The mapping version to query from the mapping channel.
mapping_version=1.20.1

## Mod Properties

mod_id=mlum
mod_name=MlumInventory
mod_license=MIT
mod_version=3.17.0
mod_group_id=com.barbwra.mlum
mod_authors=BarBwra
mod_description=Replaces the vanilla player inventory with a full-screen survival UI - bag, quests, level, skills, vehicles and faction - drawn by its own renderer with bundled Arabic fonts, a see-through backdrop and static transitions. Server-side money, skills, quests, vehicles and factions.
