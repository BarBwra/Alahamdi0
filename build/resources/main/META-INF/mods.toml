[[mods]]
modId="mlum"
version="3.10.0"
displayName="MlumInventory"
authors="BarBwra"
description='''Replaces the vanilla player inventory with a full-screen survival UI - bag, quests, level, skills, vehicles and faction - drawn by its own renderer with bundled Arabic fonts, a see-through backdrop and static transitions. Server-side money, skills, quests, vehicles and factions.'''

[[dependencies.mlum]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.mlum]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# Soft dependencies for the warehouse subsystem. Every foreign item is resolved by
# ResourceLocation at runtime, so the mod loads and runs with none of these present - a recipe
# naming a missing item is reported as unavailable in the terminal instead of crashing the pack.
[[dependencies.mlum]]
    modId="nukacraft"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.mlum]]
    modId="survivorsarsenal"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.mlum]]
    modId="survival_instinct"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
